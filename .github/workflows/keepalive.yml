# GitHub switches off scheduled workflows in a repo with no commits for 60 days. This makes a small commit on the 1st
# of every month so the timer never stops.
name: keepalive
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-keepalive.txt
          git commit -m "keepalive"
          git push
